:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w:#fff;--dim:rgba(255,255,255,.45);--ink:#111;--ac:#ffd60a;--ln:rgba(255,255,255,.22)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--w);font:400 13px I,system-ui,sans-serif;user-select:none}
#st{position:relative;height:100%;overflow:hidden}#sys{position:absolute;top:0;right:0;bottom:0;left:0;color:#fff}
#bg{position:absolute;top:0;right:0;bottom:0;left:0;transition:background .5s,opacity .3s}
svg{display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.g{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.3);border-radius:22px;backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.gl{border-radius:30px}
.pl{height:48px;border-radius:24px;display:flex;align-items:center;padding:0 4px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8)}
.t{display:flex;color:var(--w);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.03) 35%,transparent),rgba(18,18,24,.28);box-shadow:inset 0 0 0 1.2px var(--ln);transition:background .18s,color .18s;cursor:pointer;outline:0}
.t.s{border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.11));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.t:hover,.t:focus,.rb:hover,.rb:focus{background:#fff;color:var(--ink)}
.t:active{background:rgba(255,255,255,.9)}
.t .d{color:rgba(255,255,255,.45);transition:color .18s}.t:hover .d,.t:focus .d{color:rgba(17,17,17,.6)}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin:0 3px;background:rgba(18,18,24,.28);box-shadow:inset 0 0 0 1.2px var(--ln);outline:0;transition:background .18s,color .18s}
.rb.off{opacity:.5}
.tm{font-weight:600}
.fi{animation:fi .32s both}@keyframes fi{from{opacity:0}}
.te{animation:te .42s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}@keyframes te{from{opacity:0;transform:scale(.92) translateY(-8px)}}
.ov{position:absolute;top:0;right:0;bottom:0;left:0}
#cc{position:absolute;top:72px;right:24px;width:262px;padding:6px;z-index:6}
#cards{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;pointer-events:none}

.ph{display:flex;align-items:center;height:40px}
.pp{height:58px;padding:0 12px 0 14px;align-items:center;gap:10px;text-align:left;width:100%}
.pp b{display:block;font-weight:600;font-size:12px}.pp span{display:block;font-size:11px}
.tl{height:76px;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%;font-size:11px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759}
#sbo{background:#000;display:grid;place-items:center;z-index:50}
.w{width:300px;height:300px;background:#1c1c1e;border-radius:34px;display:grid;place-items:center;overflow:hidden}
.opt{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94%;transition:opacity .4s;cursor:default}
.opt.h{opacity:0;pointer-events:none}
.ch{padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.14);font-weight:500;font-size:12px;white-space:nowrap}
.ch.on{background:#fff;color:var(--ink)}
.cd{width:22px;height:22px;border-radius:50%;margin:0 3px;border:2px solid transparent}.cd.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
select{font:500 12px I,system-ui;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:7px 8px}select option{color:#111}
.lb{font-size:11px;color:rgba(255,255,255,.7);margin-right:8px;text-transform:uppercase;letter-spacing:.06em}
.fl{position:absolute;animation:fd 38s ease-in-out infinite alternate;text-align:center}@keyframes fd{0%{left:8%;top:12%}100%{left:48%;top:52%}}
.md{position:absolute;top:24px;left:45px;width:min(410px,calc(100% - 24px));max-height:calc(100% - 100px);overflow-y:auto;padding:18px;scrollbar-width:none;z-index:20}.md.wide{width:min(470px,calc(100% - 24px))}
.bk{z-index:19}
.cd2{position:absolute;pointer-events:auto;touch-action:none;height:72px;width:212px;padding:8px 14px;border-radius:22px;flex-direction:column;align-items:stretch;justify-content:center;gap:3px;overflow:hidden;cursor:pointer;transition:background .18s,color .18s,transform .15s,box-shadow .15s;font-weight:500;user-select:none}
.cd2.row{flex-direction:row;align-items:center;height:40px;width:auto;min-width:236px;padding:0 5px 0 14px;gap:10px;border-radius:20px}
.cd2.an{flex-direction:row;align-items:center;width:290px;height:108px;gap:12px;padding:10px 12px 10px 16px}
.cd2 .l1{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;white-space:nowrap}.cd2 .l1 b{margin-inline-start:auto;font-weight:600;font-variant-numeric:tabular-nums}
.cd2 .l2{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;font-variant-numeric:tabular-nums}
.cd2.mv{outline:3px solid #fff;box-shadow:0 0 0 7px rgba(255,255,255,.25),0 22px 50px rgba(0,0,0,.55);z-index:30;transform:scale(1.05);transition:none}
.ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}.ci.on{background:#111;color:#fff}
.nm{line-height:1.25;font-weight:500;overflow-wrap:anywhere}#mtT{display:flex;align-items:center;gap:8px;width:100%;transition:opacity .35s}#mtT.o{opacity:0}
.pb{height:5px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}.pb i{display:block;height:100%;border-radius:3px;background:#34c759;transition:width .6s,background .3s}
.k2{font-size:11px;font-weight:600;letter-spacing:.07em;opacity:.7}
.ch:hover,.ch:focus{background:#fff;color:#111}
.sw:focus,.cd:focus,.rb:focus,select:focus,summary:focus,.bl:focus,.cd2:focus{outline:3px solid #fff;outline-offset:2px}
.pl.cp{height:40px;border-radius:20px;padding:0 14px;gap:8px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;width:100%;cursor:pointer;font-variant-numeric:tabular-nums}
.cp .x{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;transition:opacity .35s}.cp .x.o{opacity:0}
[dir=rtl] .ro{text-align:start}[dir=rtl] input[type=text]{text-align:right}
#ts{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(380px,92%)}
.tt{padding:12px 16px;cursor:pointer;text-align:start}.tt b{font-size:14px;font-weight:600;display:block}.tt div{font-size:12.5px;opacity:.85;margin-top:3px;line-height:1.5}
.pr{display:flex;align-items:center;padding:11px 12px;border-radius:14px;font-size:15px;font-weight:500;gap:10px}.pr.nx{background:rgba(255,255,255,.95);color:var(--ink)}.pr .sp{flex:1}.pr .tn{font-variant-numeric:tabular-nums;font-weight:600}
.cm{margin:12px 4px 6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}.cm small{opacity:.6;font-weight:500;margin-inline-start:6px}
details.mc{border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.2);margin-bottom:6px}
details.mc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:14px;font-weight:500}details.mc summary::-webkit-details-marker{display:none}
.mc .tm2{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;text-align:center;font-size:13px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px 6px}
.mc .tn{flex:1;text-align:center}.mc .bl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;opacity:.5;flex:none}.mc .bl.on{opacity:1;background:#fff;color:var(--ink)}
.mc .cs{padding:0 12px 12px;font-size:12px}.mc .cs .ch{display:inline-block;margin:3px}.mc .cs .ch.m{background:rgba(255,255,255,.9);color:var(--ink)}

function wx(){const c=CITIES[S.city],now=new Date(),nh=now.getHours()+now.getMinutes()/60;
 const U=S.unit=='auto'?(navigator.language=='en-US'?'F':'C'):S.unit,cv=x=>Math.round(U=='F'?x*9/5+32:x);

 const rc=k=>k>=5?Math.min(95,60+k*3):k==3?25:k==2?10:3;

 const hours=[...Array(24)].map((_,i)=>{const h=(Math.floor(nh)+i)%24,k=i%7==6?c[8][1]:c[8][0];return{h,t:cv(tf(h)),i:cd(k,day(h))[1]}});

function analog(col,modern){let o='';
 for(let i=0;i<60;i++){const a=i*6*Math.PI/180,m=i%5==0;if(modern&&m)continue;const r1=m?80:86,r2=94;o+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="${m?'#fff':'#8e8e93'}" stroke-width="${m?3:1.2}" stroke-linecap="round"/>`}

 return`<svg viewBox="0 0 200 200" style="width:100%;height:100%">${o}<line class="ah" x1="100" y1="100" x2="100" y2="${modern?58:56}" stroke="#fff" stroke-width="${modern?5:6}" stroke-linecap="round"/><line class="am" x1="100" y1="100" x2="100" y2="${modern?30:28}" stroke="#fff" stroke-width="${modern?4:4.5}" stroke-linecap="round"/><line class="as" x1="100" y1="116" x2="100" y2="22" stroke="${col}" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="${col}"/><circle cx="100" cy="100" r="1.8" fill="#000"/></svg>`}
function cal(col){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate();
 const c=(x,st='')=>`<i style="font-style:normal;width:30px;height:30px;justify-self:center;${st}">${x}</i>`;
 let g=['S','M','T','W','T','F','S'].map(x=>c(x,'color:#8e8e93')).join('');
 for(let i=0;i<f;i++)g+=c('');
 for(let d=1;d<=dm;d++)g+=c(d,d==n.getDate()?`background:${col};color:#000;border-radius:50%`:'');
 return`<div style="padding:18px;width:100%"><div style="color:${col};font-weight:600;letter-spacing:.08em;margin-bottom:8px;font-size:13px">${MON[m].toUpperCase()}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px;font-weight:500;line-height:30px">${g}</div></div>`}
function widget(k,col){const n=new Date(),w=wx();

 if(k==4)return cal(col);
